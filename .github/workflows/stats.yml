
name: Generate Neon GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=shruti060805-hash&show_icons=true&include_all_commits=true&bg_color=0D1117&title_color=FF77B7&text_color=F8D7E8&icon_color=C084FC&border_color=FF77B7"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=shruti060805-hash&layout=compact&langs_count=6&bg_color=0D1117&title_color=FF77B7&text_color=F8D7E8&border_color=FF77B7"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update neon GitHub statistics cards" || exit 0
          git push
